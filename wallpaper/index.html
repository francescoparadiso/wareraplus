<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════
  WarEra+ — involucro dello sfondo di Wallpaper Engine
  ------------------------------------------------------------------
  Questa cartella è lo sfondo che si pubblica sullo Steam Workshop, e
  NON contiene il tool: porta la pagina dello sfondo sul sito con
  ?wallpaper=1. Ogni deploy del sito aggiorna quindi anche lo sfondo
  senza ripubblicare niente. Cosa fa il sito in modalità sfondo:
  src/app/wallpaperMode.js.

  ⚠️ Niente iframe: nel browser di Wallpaper Engine (CEF 146, provato il
  2026-10-12) qualunque iframe di un altro sito va in crash appena arriva
  la risposta, anche example.com. Per questo si naviga la pagina intera
  (location.replace) e da lì le proprietà le riceve il sito stesso.

  Qui stanno solo tre cose:
  1. le proprietà di Wallpaper Engine (project.json) → parametri dell'URL;
     la chiave API nel FRAMMENTO (#k=…), che non parte mai verso un
     server e che il sito cancella appena letto;
  2. l'attesa delle proprietà: Wallpaper Engine le manda tutte appena la
     pagina è pronta, e si parte con quelle;
  3. l'attesa della rete: Wallpaper Engine parte con Windows, spesso
     prima che la connessione ci sia. Una navigazione fatta in quel
     momento resterebbe sulla pagina d'errore per tutta la sessione,
     quindi si prova prima a raggiungere il sito e si ritenta da soli.
  ══════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WarEra+</title>
  <style>
    :root { --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #waiting {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      font: 15px/1.4 'Segoe UI', system-ui, sans-serif; color: var(--fg); text-align: center;
    }
    #waiting small { color: var(--muted); }
  </style>
</head>
<body>
  <div id="waiting">
    <div>WarEra+</div>
    <small id="waiting-text">Loading…</small>
  </div>

  <script>
    'use strict';

    // Canale: "live" è quello che usano tutti; "dev" serve a provare lo
    // sfondo contro il branch dev prima di portare le modifiche sul live.
    // Gli stessi indirizzi stanno in src/app/wallpaperMode.js (CHANNELS).
    const CHANNELS = {
      live: 'https://wareraplus.vercel.app',
      dev: 'https://wareraplus-dev.vercel.app',
    };
    // Prova in locale: index.html?site=http://localhost:5173 punta al server
    // di sviluppo (Vite serve anche questa cartella). Solo localhost, e solo
    // da un browser: Wallpaper Engine apre la pagina senza parametri.
    const LOCAL_SITE = (() => {
      const s = new URLSearchParams(location.search).get('site') || '';
      return /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(s) ? s : null;
    })();
    if (LOCAL_SITE) CHANNELS.live = CHANNELS.dev = LOCAL_SITE;
    const RETRY_MS = 15000;

    // Valori di partenza: gli stessi di project.json, servono solo se la
    // pagina si apre fuori da Wallpaper Engine (prova in un browser).
    const props = {
      channel: 'live', view: 'diplomacy', rotate: false, rotateMinutes: 10,
      framing: 'world', country: '', theme: 'dark', lang: 'auto',
      animations: true, battles: true, blocLabels: true, ticker: true,
      menubar: false, apiKey: '',
    };
    // Nome della proprietà in project.json → nome che usa il sito.
    const KEYMAP = {
      channel: 'channel', view: 'view', rotate: 'rotate', rotateminutes: 'rotateMinutes',
      framing: 'framing', country: 'country', theme: 'theme', language: 'lang',
      animations: 'animations', battles: 'battles', alliancelabels: 'blocLabels',
      ticker: 'ticker', menubar: 'menubar', apikey: 'apiKey',
    };

    const waitingText = document.getElementById('waiting-text');
    let started = false;
    let retryTimer = null;

    function siteUrl(base) {
      const q = new URLSearchParams({
        wallpaper: '1',
        view: props.view,
        rotate: props.rotate ? '1' : '0',
        rotatemin: String(props.rotateMinutes),
        framing: props.framing,
        theme: props.theme,
        lang: props.lang,
        anim: props.animations ? '1' : '0',
        battles: props.battles ? '1' : '0',
        labels: props.blocLabels ? '1' : '0',
        ticker: props.ticker ? '1' : '0',
        menubar: props.menubar ? '1' : '0',
      });
      // `focus` e non `country`: ?country= è il deep-link del sito (vuole un id).
      if (props.country) q.set('focus', props.country);
      const key = props.apiKey ? `#k=${encodeURIComponent(props.apiKey)}` : '';
      return `${base}/?${q}${key}`;
    }

    // Prima di partire: il sito risponde? `no-cors` basta a sapere se la
    // rete c'è (una risposta opaca arriva, un errore di rete no).
    async function go() {
      clearTimeout(retryTimer);
      const base = CHANNELS[props.channel] || CHANNELS.live;
      try {
        await fetch(`${base}/manifest.webmanifest`, { mode: 'no-cors', cache: 'no-store' });
      } catch {
        waitingText.textContent = 'Waiting for an internet connection…';
        retryTimer = setTimeout(go, RETRY_MS);
        return;
      }
      location.replace(siteUrl(base));
    }

    function start() {
      if (started) return;
      started = true;
      go();
    }

    // Da qui in poi le proprietà le riceve il sito (wallpaperMode.js
    // definisce lo stesso listener). Questo serve solo per la prima
    // chiamata, che arriva con TUTTE le proprietà, e per quelle che
    // dovessero arrivare mentre si aspetta la rete.
    window.wallpaperPropertyListener = {
      applyUserProperties(changed) {
        for (const [name, prop] of Object.entries(changed)) {
          const key = KEYMAP[name];
          if (key && prop && 'value' in prop) props[key] = prop.value;
        }
        start();
      },
    };

    // Fuori da Wallpaper Engine nessuno chiama applyUserProperties: si
    // parte coi valori di default dopo un attimo.
    setTimeout(start, 1000);
  </script>
</body>
</html>
